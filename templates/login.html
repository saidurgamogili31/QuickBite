{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Log in to QuickBite</h1><p class="muted">Good food is just around the corner.</p>
<form method="post" class="stack-form"><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="btn full" type="submit">Log in</button></form>
<p class="auth-switch">New to QuickBite? <a href="{{ url_for('register') }}">Create an account</a></p></section></div>
{% endblock %}
