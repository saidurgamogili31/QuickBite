{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card"><span class="eyebrow">JOIN THE TABLE</span><h1>Create your account</h1><p class="muted">Your next favourite meal is waiting.</p>
<form method="post" class="stack-form"><label>Full name<input name="name" required autocomplete="name" placeholder="Your name"></label><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn full" type="submit">Create account</button></form>
<p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section></div>
{% endblock %}
